.tools{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin-bottom:.6rem}

        <p id="equipmentHistoryStatus" role="status"></p>
        <div id="equipmentHistoryResults"></div>
    </dialog>

<script>
document.getElementById('sampleDetail').addEventListener('click',event=>{
    if(event.target.closest('a')) { event.preventDefault(); }
});
document.getElementById('mapTodayCard').addEventListener('click',event=>{
    if(event.target.closest('.today-quick a')) {
        event.preventDefault();
        document.getElementById('sampleDetail').textContent='見本なので外部アプリは開きません。';
    }
});
document.getElementById('customerList').addEventListener('click',event=>{
    const row=event.target.closest('[data-customer-id]');
    if(row)document.getElementById('sampleDetail').textContent=visits.find(v=>v.id===row.dataset.customerId).company;
});
MapCore.initMap();
