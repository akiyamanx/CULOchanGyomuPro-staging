<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>業務Pro Gmail接続診断</title>
<style>body{font:1rem/1.55 system-ui,sans-serif;margin:1rem auto;padding:0 1rem;max-width:40rem;color:#18283c}button,input{font:inherit;min-height:44px;box-sizing:border-box}input[type=text]{width:100%;padding:.4rem}button{display:block;padding:.45rem .85rem;margin:.8rem 0}label{display:block}label:has(input[type=checkbox]){display:flex;align-items:center;gap:.5rem}output{display:block;padding:.75rem;background:#edf4ff;white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}</style>
<script defer src="../shared/app-profile.js"></script><script defer src="../shared/app-storage.js"></script><script defer src="../map/gmail-transport.js"></script><script defer src="../map/gmail-source.js"></script><script defer src="../map/gmail-senders.js"></script><script defer src="./gmail-diagnosis.js"></script></head>
<body><main><h1>Gmail取り込みの診断</h1>
<p>お試し版の読み取り専用テストです。Driveや仕事データには接続せず、登録・同期・送信・保存もしません。本番と同じGmail経路で、新しい順のメール1件までを試します。</p>
<p>いつもの仕事用アカウントを選んでください。結果にメールの件名、差出人、ファイル名、アカウント名などは表示しません。検査は読み取りまでで、依頼書の解析・登録は確認しません。</p>
<section id="controls" hidden aria-label="診断操作">
<label for="senders">差出人（いつもの登録名を読点で区切る）</label><input type="text" id="senders" autocomplete="off" spellcheck="false" maxlength="820" aria-describedby="senderHint"><small id="senderHint">空欄なら、いつもの業務Proに登録している名前を入力してください。この画面だけで使用し、保存はしません。</small>
<label><input type="checkbox" id="attachment" checked>添付1件の取得も診断する（最大10 MB、保存なし）</label>
<button type="button" id="prepare">1. Googleログインを準備</button>
<button type="button" id="run" disabled>2. Googleにつないで診断</button>
</section>
<output id="result" role="status" aria-live="polite">準備中…</output>
<p><a href="../">業務Proのお試し版に戻る</a></p></main></body></html>
