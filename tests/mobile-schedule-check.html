<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>業務Pro 日程表示テスト</title><style>body{font-family:system-ui;margin:16px}iframe{display:block;border:1px solid #64748b;margin:8px 0 20px}button{min-height:44px}output{display:block;white-space:pre-wrap;margin-top:4px}</style><h1>日程表示：ブラウザ試験</h1><p>お試し版を指定の幅で表示し、架空CSVをプレビューします。登録・同期はしません。</p><div id="rows"></div><script>
for(const width of [360,390,768,820]){
  const label=document.createElement('h2');label.textContent=width+'px';
  const btn=document.createElement('button');btn.textContent=width+'pxで架空の依頼書を試す';
  const out=document.createElement('output');out.setAttribute('role','status');
  const frame=document.createElement('iframe');frame.title=width+'pxの業務Pro';frame.width=width;frame.height=730;frame.src='../';
  document.querySelector('#rows').append(label,btn,out,frame);
  btn.onclick=async()=>{
    try {
      const w=frame.contentWindow,d=w.document;
      const el=d.querySelector('#fileInput');
      const dates='会社名,住所,依頼内容,工事予定日時\n架空・希望,架空市テスト町1,修理,2026/11/16(月) 09:00 希望\n架空・確定,架空市テスト町2,修理,2026/11/16(月) 10:00 確定\n架空・未定,架空市テスト町3,修理,\n架空・不一致,架空市テスト町4,修理,2026/11/16(火) 11:00';
      const dt=new w.DataTransfer();dt.items.add(new w.File([dates],'架空・日程確認.csv',{type:'text/csv'}));el.files=dt.files;
      el.dispatchEvent(new w.Event('change',{bubbles:true}));
      const cards=()=>[...d.querySelectorAll('#requestImportResults .request-card')];
      const started=Date.now();while(cards().length!==4&&Date.now()-started<3000)await new Promise(r=>setTimeout(r,70));
      const cc=cards(), values=cc.map(x=>x.querySelector('[data-field=scheduleKind]')?.value);
      const bad=cc[3], warn=bad?.querySelector('.request-warning')?.textContent||'';
      const skip=bad && !bad.querySelector('[data-field=selected]').checked && !bad.querySelector('[data-field=appoDate]').value;
      const panel=d.querySelector('#requestImportPanel');
      const fit=panel.scrollWidth<=panel.clientWidth+1 && d.documentElement.scrollWidth<=w.innerWidth+1;
      const touch=cc.every(x=>x.querySelector('[data-field=scheduleKind]').getBoundingClientRect().height>=44);
      const passed=values[0]==='preferred'&&values[1]==='confirmed'&&values[2]==='undated'&&warn.includes('一致しません')&&skip&&fit&&touch;
      out.textContent=(passed?'PASS':'FAIL')+'：表示幅 '+w.innerWidth+'px／4行 '+values.join(', ')+'／曜日不一致は日時空欄・選択なし '+Boolean(skip)+'／横はみ出しなし '+fit+'／区分選択44px以上 '+touch;
    }catch(e){out.textContent='FAIL：'+e.message;}
  };
}
</script></html>
